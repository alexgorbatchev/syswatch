name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -- -W clippy::all
      - run: cargo test --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: syswatch-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: syswatch-linux-aarch64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: syswatch-linux-x86_64-static
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: syswatch-linux-aarch64-static
          - target: armv5te-unknown-linux-musleabi
            os: ubuntu-latest
            name: syswatch-linux-armv5te-static
          - target: x86_64-apple-darwin
            os: macos-latest
            name: syswatch-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: syswatch-macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Validate version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "syswatch") | .version')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match Cargo.toml version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install aarch64 cross-compiler (Linux aarch64 glibc)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # armv5te goes through cross, not zigbuild: zig's musl for this
      # target lacks the __sync_* atomic helpers libgcc provides, so the
      # link fails. The target is static musl, so there's no glibc floor.
      - name: Install cross (armv5te)
        if: startsWith(matrix.target, 'armv5te')
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Zig (Linux musl)
        if: contains(matrix.target, 'linux-musl') && !startsWith(matrix.target, 'armv5te')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild (Linux musl)
        if: contains(matrix.target, 'linux-musl') && !startsWith(matrix.target, 'armv5te')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == armv5te-* ]]; then
            cross build --release --locked --target ${{ matrix.target }}
          elif [[ "${{ matrix.target }}" == *"linux-musl" ]]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p package dist
          cp target/${{ matrix.target }}/release/syswatch LICENSE package/
          tar czf "dist/${{ matrix.name }}-${VERSION}.tar.gz" -C package syswatch LICENSE

      - name: Smoke test native archive
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          mkdir smoke
          tar xzf "dist/${{ matrix.name }}-${VERSION}.tar.gz" -C smoke
          test -s smoke/LICENSE
          smoke/syswatch --version
          smoke/syswatch --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: syswatch-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: Prebuilt SysWatch binaries for macOS and Linux, including static Linux builds and SHA-256 checksums.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
