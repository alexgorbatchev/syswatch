name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded PR pushes are cancelled; every main commit keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked -- -W clippy::all

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

  # Nothing built the flake, so it silently rotted: the version was
  # pinned five releases behind and `src` was dragging `target/` into
  # the store. Cheap Linux-only job to keep both honest.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check
        run: nix flake check --all-systems

      - name: Build
        run: nix build .#syswatch --print-build-logs

      - name: Version matches Cargo.toml
        run: |
          cargo_version=$(nix eval --raw --impure --expr \
            '(builtins.fromTOML (builtins.readFile ./Cargo.toml)).package.version')
          built=$(nix eval --raw .#syswatch.version)
          echo "Cargo.toml=$cargo_version  package.nix=$built"
          test "$cargo_version" = "$built"
